services:
  # Backend FastAPI Web Service
  - type: web
    name: researchgap-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./researchgap.db
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: SECRET_KEY
        generateValue: true

  # Frontend Static Web Site
  - type: web
    name: researchgap-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: researchgap-backend
          property: host
