version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchgap_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./researchgap.db
      - LLM_PROVIDER=openai_compatible
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - SECRET_KEY=${SECRET_KEY:-docker_secret_key_researchgap_2025}
    volumes:
      - ./uploads:/app/uploads
      - ./researchgap_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchgap_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
